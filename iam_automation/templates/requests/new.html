{% extends "base.html" %}{% block title %}New Request{% endblock %}{% block content %}<div class="container py-5 form-page"><a class="back-link" href="{{ url_for('requests.request_list') }}">My requests</a><p class="eyebrow mt-3 mb-1">Request management</p><h1>New employee request</h1><p class="text-secondary">Submit a structured change for reviewer approval. No database publication occurs at this step.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form class="surface p-4 p-lg-5" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Operation</label><select class="form-select" name="operation_type" required><option value="">Select an operation</option>{% for value,label in operation_options.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Employee ID</label><input class="form-control" name="entity_id" placeholder="Employee or worker identifier" required></div><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name"></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name"></div><div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" name="job_title"></div><div class="col-md-6"><label class="form-label">Line of business</label><input class="form-control" name="lob"></div><div class="col-12"><label class="form-label">Business reason</label><textarea class="form-control" name="reason" rows="4" required></textarea></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" href="{{ url_for('requests.request_list') }}">Cancel</a><button class="btn btn-primary">Submit for review</button></div></form></div>{% endblock %}
