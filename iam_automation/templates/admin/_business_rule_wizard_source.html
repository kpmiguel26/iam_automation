<section class="surface p-4">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-3"><div><p class="eyebrow mb-1">Step 2 of 5 - {{ phase }}</p><h2 class="h5 mb-1">Choose the report</h2><p class="small text-secondary mb-0">Limit the rule to one source so fields from other reports do not appear as missing.</p></div><span class="badge text-bg-primary">2 / 5</span></div>
  {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin.business_rule_wizard_details') }}" hx-post="{{ url_for('admin.business_rule_wizard_details') }}" hx-target="#rule-wizard" hx-swap="innerHTML" class="vstack gap-3">
    <input type="hidden" name="phase" value="{{ phase }}">
    <label class="form-label mb-0" for="rule-source">Report / source</label>
    <select id="rule-source" class="form-select" name="source_system" required>
      <option value="" selected disabled>Select a report</option>
      {% for source in sources %}<option value="{{ source.key }}">{{ source.label }} - {{ source.description }}</option>{% endfor %}
    </select>
    <div class="d-flex justify-content-between gap-2"><button class="btn btn-sm btn-outline-secondary" type="button" hx-get="{{ url_for('admin.business_rules') }}" hx-target="#rule-wizard" hx-select="#rule-wizard" hx-swap="outerHTML">Back</button><button class="btn btn-primary" type="submit">Continue</button></div>
  </form>
</section>
