<section class="surface p-4">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-3"><div><p class="eyebrow mb-1">Step 1 of 4</p><h2 class="h5 mb-1">When should it run?</h2><p class="small text-secondary mb-0">Choose whether the rule runs before or after the orchestrator processes the source.</p></div><span class="badge text-bg-primary">1 / 4</span></div>
  {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin.business_rule_wizard_source') }}" hx-post="{{ url_for('admin.business_rule_wizard_source') }}" hx-target="#rule-wizard" hx-swap="innerHTML" class="vstack gap-3">
    <label class="form-label mb-0" for="rule-phase">Execution phase</label>
    <select id="rule-phase" class="form-select" name="phase" required><option value="" selected disabled>Select a phase</option>{% for phase in phases %}<option value="{{ phase }}">{{ phase }}{% if phase == 'BEFORE' %} — evaluate staged evidence{% else %} — evaluate after persistence{% endif %}</option>{% endfor %}</select>
    <div class="d-flex justify-content-between gap-2"><button class="btn btn-sm btn-outline-secondary" type="button" hx-get="{{ url_for('admin.business_rules') }}" hx-target="#rule-wizard" hx-select="#rule-wizard" hx-swap="outerHTML">Cancel</button><button class="btn btn-primary" type="submit">Continue</button></div>
  </form>
</section>
