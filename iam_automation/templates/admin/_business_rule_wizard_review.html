<section class="surface p-4">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-3"><div><p class="eyebrow mb-1">Step 5 of 5 - {{ phase }}</p><h2 class="h5 mb-1">Review and create</h2><p class="small text-secondary mb-0">Confirm the definition before saving it as a draft.</p></div><span class="badge text-bg-primary">5 / 5</span></div>
  <dl class="row small mb-4"><dt class="col-5 text-secondary">Name</dt><dd class="col-7">{{ name }}</dd><dt class="col-5 text-secondary">Report</dt><dd class="col-7">{{ source_label }}</dd><dt class="col-5 text-secondary">Phase</dt><dd class="col-7"><span class="badge text-bg-light border">{{ phase }}</span></dd><dt class="col-5 text-secondary">Condition</dt><dd class="col-7"><code>{{ field }} {{ operator }}{% if value %} {{ value }}{% endif %}</code></dd></dl>
  <form method="post" action="{{ url_for('admin.business_rules') }}" hx-post="{{ url_for('admin.business_rules') }}" hx-target="#rules-table-region" hx-swap="outerHTML" hx-indicator="#rule-evaluation-indicator" class="vstack gap-3">
    <input type="hidden" name="phase" value="{{ phase }}"><input type="hidden" name="source_system" value="{{ source_system }}"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="description" value="{{ description }}"><input type="hidden" name="field" value="{{ field }}"><input type="hidden" name="operator" value="{{ operator }}"><input type="hidden" name="value" value="{{ value }}">
    <div><label class="form-label" for="rule-severity">Severity</label><select id="rule-severity" class="form-select" name="severity" required>{% for severity in severities %}<option value="{{ severity }}" {% if severity == 'WARNING' %}selected{% endif %}>{{ severity }}</option>{% endfor %}</select></div>
    <div class="d-flex justify-content-between gap-2"><button class="btn btn-sm btn-outline-secondary" type="button" hx-get="{{ url_for('admin.business_rule_wizard_condition') }}" hx-target="#rule-wizard" hx-swap="innerHTML" hx-vals='{{ {"phase": phase, "source_system": source_system, "name": name, "description": description, "field": field, "operator": operator, "value": value}|tojson }}'>Back</button><button class="btn btn-primary" type="submit">Create rule</button></div>
  </form>
</section>
