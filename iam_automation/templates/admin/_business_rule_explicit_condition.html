<div data-explicit-condition class="border rounded p-3 bg-light vstack gap-3">
  <div><label class="form-label" for="condition-group">When should the rule match?</label><select id="condition-group" class="form-select" name="condition_group"><option value="all">All conditions must match</option><option value="any">Any condition may match</option></select><div class="form-text">Add one comparison for a simple rule or several for a compound rule.</div></div>
  <div data-condition-rows class="vstack gap-3">
    {% for row in range(2) %}
    <div data-condition-row class="border rounded p-3 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-2"><strong>Comparison {{ row + 1 }}</strong>{% if row > 0 %}<button type="button" class="btn btn-sm btn-link text-danger p-0" data-remove-condition-row>Remove</button>{% endif %}</div>
      <div class="row g-2 align-items-end">
        <div class="col-md-3"><label class="form-label" for="left-kind-{{ row }}">Left side</label><select id="left-kind-{{ row }}" class="form-select" name="condition_left_kind" data-condition-left-kind><option value="field">Report field</option><option value="literal">Fixed value</option><option value="derived">Calculated value</option></select></div>
        <div class="col-md-3" data-condition-left-field><label class="form-label" for="left-source-{{ row }}">Report</label><select id="left-source-{{ row }}" class="form-select" name="condition_left_source" data-condition-field-source>{% for source in sources if source.key != 'ALL' %}<option value="{{ source.key }}">{{ source.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-field><label class="form-label" for="left-field-{{ row }}">Field</label><select id="left-field-{{ row }}" class="form-select" name="condition_left_field" data-condition-field-select>{% for item in condition_field_options %}<option value="{{ item.key }}" data-condition-source="{{ item.source }}">{{ item.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-literal hidden><label class="form-label" for="left-value-{{ row }}">Value</label><input id="left-value-{{ row }}" class="form-control" name="condition_left_value" placeholder="For example: TERMINATED"></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-function-{{ row }}">Calculation</label><select id="left-function-{{ row }}" class="form-select" name="condition_left_function">{% for function in condition_functions %}<option value="{{ function }}">{{ function|replace('_', ' ')|title }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg1-kind-{{ row }}">First input</label><select id="left-arg1-kind-{{ row }}" class="form-select" name="condition_left_arg1_kind"><option value="field">Report field</option><option value="literal">Fixed date/value</option></select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg1-source-{{ row }}">First report</label><select id="left-arg1-source-{{ row }}" class="form-select" name="condition_left_arg1_source" data-condition-field-source>{% for source in sources if source.key != 'ALL' %}<option value="{{ source.key }}">{{ source.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg1-field-{{ row }}">First field</label><select id="left-arg1-field-{{ row }}" class="form-select" name="condition_left_arg1_field" data-condition-field-select>{% for item in condition_field_options %}<option value="{{ item.key }}" data-condition-source="{{ item.source }}">{{ item.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg1-value-{{ row }}">First value</label><input id="left-arg1-value-{{ row }}" class="form-control" name="condition_left_arg1_value" placeholder="Date or number"></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg2-kind-{{ row }}">Second input</label><select id="left-arg2-kind-{{ row }}" class="form-select" name="condition_left_arg2_kind"><option value="field">Report field</option><option value="literal">Fixed date/value</option></select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg2-source-{{ row }}">Second report</label><select id="left-arg2-source-{{ row }}" class="form-select" name="condition_left_arg2_source" data-condition-field-source>{% for source in sources if source.key != 'ALL' %}<option value="{{ source.key }}">{{ source.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg2-field-{{ row }}">Second field</label><select id="left-arg2-field-{{ row }}" class="form-select" name="condition_left_arg2_field" data-condition-field-select>{% for item in condition_field_options %}<option value="{{ item.key }}" data-condition-source="{{ item.source }}">{{ item.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-left-derived hidden><label class="form-label" for="left-arg2-value-{{ row }}">Second value</label><input id="left-arg2-value-{{ row }}" class="form-control" name="condition_left_arg2_value" placeholder="Date or number"></div>
        <div class="col-md-3"><label class="form-label" for="condition-operator-{{ row }}">Comparison</label><select id="condition-operator-{{ row }}" class="form-select" name="condition_operator">{% for operator in explicit_operators %}<option value="{{ operator }}">{{ operator|replace('_', ' ')|title }}</option>{% endfor %}</select></div>
        <div class="col-md-3"><label class="form-label" for="right-kind-{{ row }}">Right side</label><select id="right-kind-{{ row }}" class="form-select" name="condition_right_kind" data-condition-right-kind><option value="literal">Fixed value</option><option value="field">Report field</option></select></div>
        <div class="col-md-3" data-condition-right-field hidden><label class="form-label" for="right-source-{{ row }}">Report</label><select id="right-source-{{ row }}" class="form-select" name="condition_right_source" data-condition-field-source>{% for source in sources if source.key != 'ALL' %}<option value="{{ source.key }}">{{ source.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-right-field hidden><label class="form-label" for="right-field-{{ row }}">Field</label><select id="right-field-{{ row }}" class="form-select" name="condition_right_field" data-condition-field-select>{% for item in condition_field_options %}<option value="{{ item.key }}" data-condition-source="{{ item.source }}">{{ item.label }}</option>{% endfor %}</select></div>
        <div class="col-md-3" data-condition-right-literal><label class="form-label" for="right-value-{{ row }}">Value</label><input id="right-value-{{ row }}" class="form-control" name="condition_right_value" placeholder="For example: 0, 30"></div>
      </div>
    </div>
    {% endfor %}
  </div>
  <button type="button" class="btn btn-sm btn-outline-secondary align-self-start" data-add-condition-row>Add another comparison</button>
</div>
