<section class="surface p-4">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-3"><div><p class="eyebrow mb-1">Step 4 of 5 - {{ phase }}</p><h2 class="h5 mb-1">Define the condition</h2><p class="small text-secondary mb-0">Choose from fields available in the selected report and an allow-listed operator.</p></div><span class="badge text-bg-primary">4 / 5</span></div>
  {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin.business_rule_wizard_review') }}" hx-post="{{ url_for('admin.business_rule_wizard_review') }}" hx-target="#rule-wizard" hx-swap="innerHTML" class="vstack gap-3">
    <input type="hidden" name="phase" value="{{ phase }}"><input type="hidden" name="source_system" value="{{ source_system }}"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="description" value="{{ description }}">
    <div><label class="form-label" for="rule-field">Field</label><select id="rule-field" class="form-select" name="field" required><option value="" disabled {% if not field|default('') %}selected{% endif %}>Select a field</option>{% for item in fields %}<option value="{{ item }}" {% if item == field|default('') %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
    <div><label class="form-label" for="rule-operator">Operator</label><select id="rule-operator" class="form-select" name="operator" required><option value="" disabled {% if not operator|default('') %}selected{% endif %}>Select an operator</option>{% for item in operators %}<option value="{{ item }}" {% if item == operator|default('') %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
    <div><label class="form-label" for="rule-value">Expected value</label><input id="rule-value" class="form-control" name="value" value="{{ value|default('') }}" placeholder="Text for contains; comma-separated for in"></div>
    <div class="d-flex justify-content-between gap-2"><button class="btn btn-sm btn-outline-secondary" type="button" hx-get="{{ url_for('admin.business_rule_wizard_details') }}" hx-target="#rule-wizard" hx-swap="innerHTML" hx-vals='{{ {"phase": phase, "source_system": source_system, "name": name, "description": description}|tojson }}'>Back</button><button class="btn btn-primary" type="submit">Continue</button></div>
  </form>
</section>
