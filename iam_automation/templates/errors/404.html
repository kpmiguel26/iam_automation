{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="container py-5">
  <section class="surface p-5 text-center">
    <p class="eyebrow">IAM Automation</p>
    <h1>Page not found</h1>
    <p class="text-secondary">The page may have moved or the link may no longer be available.</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Return to workspace</a>
  </section>
</div>
{% endblock %}
